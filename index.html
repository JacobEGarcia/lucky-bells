<style>
  :root {
    --ink: #35302a; --ink-soft: #6b6257; --paper: #f7f2e7; --shu: #c3272b; --gold: #b98a1c;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  #ui { position: fixed; inset: 0; pointer-events: none;
    font-family: 'Hiragino Mincho ProN', 'Hiragino Mincho Pro', YuMincho, 'Yu Mincho', 'Noto Serif CJK JP', 'Noto Serif JP', Georgia, serif; }
  #titlejp { position: absolute; top: 5%; left: 6.5%; color: var(--ink);
    font-size: clamp(34px, 6vw, 64px); font-weight: 600; letter-spacing: 0.14em; }
  #title { position: absolute; top: calc(5% + clamp(44px, 7.5vw, 78px)); left: 6.8%; color: var(--ink-soft);
    font-size: clamp(10px, 1.5vw, 14px); letter-spacing: 0.42em; text-transform: uppercase; }
  #sidejp { position: absolute; top: 14%; right: 6%; writing-mode: vertical-rl; color: var(--ink-soft);
    font-size: clamp(12px, 1.8vw, 17px); letter-spacing: 0.5em; opacity: 0.75; }
  #seal { position: absolute; right: 6%; bottom: 7%; width: clamp(40px, 5.5vw, 58px); height: clamp(40px, 5.5vw, 58px);
    background: var(--shu); border-radius: 8px; display: flex; align-items: center; justify-content: center;
    color: #f7f2e7; font-size: clamp(22px, 3.2vw, 34px); box-shadow: 0 1px 0 rgba(53,48,42,0.25);
    transform: rotate(-2deg); opacity: 0.92; }
  @keyframes invitePulse { 0%,100% { box-shadow: 0 0 0 0 rgba(195,58,36,0.35); } 50% { box-shadow: 0 0 0 9px rgba(195,58,36,0); } }
  .invite { animation: invitePulse 2.2s ease-in-out infinite; border-color: rgba(195,58,36,0.6) !important; color: #c73a24 !important; }
  .pill { position: absolute; pointer-events: auto; background: transparent; border: 1px solid rgba(53,48,42,0.45);
    color: var(--ink); border-radius: 999px; font-family: inherit; font-size: 13px; letter-spacing: 0.14em;
    padding: 8px 18px; cursor: pointer; transition: background .25s, color .25s; }
  .pill:hover { background: var(--ink); color: var(--paper); }
  #share { top: 18px; left: 18px; display: none; }
  #clear { top: 58px; left: 18px; display: none; }
  #tunename { position: absolute; top: 152px; left: 20px; display: none; pointer-events: auto; width: 168px;
    background: transparent; border: none; border-bottom: 1px solid rgba(53,48,42,0.3); color: var(--ink);
    font-family: inherit; font-size: 13px; font-style: italic; letter-spacing: 0.08em; padding: 6px 2px; outline: none; }
  #tunename::placeholder { opacity: 0.45; }
  body.night #tunename { border-bottom-color: rgba(240,233,216,0.3); }
  #mute { top: 18px; right: 18px; width: 40px; height: 40px; padding: 0; font-size: 16px; }
  #echoBtn { left: 50%; bottom: 4.5%; transform: translateX(-50%); border-color: rgba(195,39,43,0.55); color: var(--shu); }
  #echoBtn:hover { background: var(--shu); color: var(--paper); }
  #echoBtn .jp { margin-left: 0.6em; opacity: 0.7; }
  #nightBtn { left: 6%; bottom: 4.5%; }
  #nightBtn .jp { margin-left: 0.6em; opacity: 0.7; }
  body.night #nightBtn { border-color: rgba(185,138,28,0.7); color: var(--gold); }
  body.night { --ink: #f0e9d8; --ink-soft: #a89e8c; --paper: #14110d; }
  body.night .pill { border-color: rgba(240,233,216,0.4); }
  body.night .pill:hover { background: var(--ink); color: #14110d; }
  body.night #echoBtn:hover { background: var(--shu); color: var(--paper); }
  #status { position: absolute; left: 50%; bottom: 9.6%; transform: translateX(-50%);
    color: var(--ink-soft); font-size: clamp(12px, 1.7vw, 15px); letter-spacing: 0.2em; text-align: center; width: 92vw; }
  #best { position: absolute; left: 50%; bottom: 12.9%; transform: translateX(-50%);
    color: var(--gold); font-size: clamp(10px, 1.4vw, 12px); letter-spacing: 0.3em; text-align: center; display: none; }
  #day { position: absolute; top: 18px; left: 50%; transform: translateX(-50%) rotate(-3deg);
    background: var(--shu); color: #f7f2e7; font-size: 10px; letter-spacing: 0.16em;
    padding: 4px 7px 3px 9px; border-radius: 4px; opacity: 0; transition: opacity 1s;
    box-shadow: 0 1px 0 rgba(53,48,42,0.25); }
  #loopWrap { position: absolute; left: 50%; bottom: 8.5%; transform: translateX(-50%);
    width: min(300px, 60vw); height: 3px; border-radius: 2px; background: rgba(53,48,42,0.14); overflow: hidden; }
  #loopFill { height: 100%; width: 0%; background: var(--gold); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="titlejp">福の鈴</div>
  <div id="title">Lucky Bells</div>
  <div id="sidejp">招き猫の音あそび</div>
  <div id="seal">福</div>
  <button id="share" class="pill">share your tune</button>
  <button id="clear" class="pill">start over</button>
  <input id="tunename" maxlength="28" placeholder="name this tune" autocomplete="off" spellcheck="false">
  <button id="mute" class="pill" title="mute">音</button>
  <button id="echoBtn" class="pill">echo game<span class="jp">まねっこ</span></button>
  <button id="nightBtn" class="pill">night<span class="jp">夜</span></button>
  <div id="day"></div>
  <div id="best"></div>
  <div id="status">tap something lucky</div>
  <div id="loopWrap"><div id="loopFill"></div></div>
</div>

}
// rain at night: a soft pink-noise wash, breathing slowly under the bells
function updateRainAudio() {
  if (!AC) return;

  if (want && !rainNodes) {
    const len = Math.floor(AC.sampleRate * 2);
    const buf = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);

      for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = last * 0.94 + w * 0.06; d[i] = last * 3.2; }

// ---------------- loop recorder ----------------
const LOOP_S = 9.6, STEPS = 64;
let loopStart = null;
let events = [];
let tapRhythm = [], echoAnswered = true, echoReplayed = 0; // v47: the ground answers your rhythm
let lastStep = -1;
// tape drift: over long sessions the loop breathes a little, like a well-loved cassette
let DRIFT_A1 = 0.012, DRIFT_P1 = 150, DRIFT_A2 = 0.007, DRIFT_P2 = 97;
const DRIFT_PH2 = 1.3;
// v50: the drift engages in seconds at nightfall but releases over a slow dawn window -
// the loop wakes up dry gradually, like the shrine pools cooling at first light
let tapeEase = 0;
// v53: first frost - snow nights run the same drift the other way: a touch faster, colder, tighter
let frostEase = 0;
function applyDrift() {
  const e = tapeEase, f = frostEase;
  DRIFT_A1 = 0.012 + e * 0.008 + f * 0.003; DRIFT_P1 = 150 + e * 40 - f * 55;
  DRIFT_A2 = 0.007 + e * 0.004 + f * 0.002; DRIFT_P2 = 97 + e * 34 - f * 30;
  if (!AC) return;
  if (warmLp) warmLp.frequency.value = 19000 - e * 13800;
  if (frostHs) frostHs.gain.value = f * 4;
  if (frostHp) frostHp.frequency.value = 40 + f * 100;
  if (wobGain) wobGain.gain.value = e * 7 + f * 4;
}
function updateTapeDrift() {
  tapeEase = (night && LB_SEASON === 'rain') ? 1 : 0;
  frostEase = (night && LB_SEASON === 'snow') ? 1 : 0;
  applyDrift();
}
function loopPhase() {
  if (loopStart === null || !AC) return 0;
  const el = AC.currentTime - loopStart;
  const tw = el
    + DRIFT_A1 * DRIFT_P1 / (2 * Math.PI) * (1 - Math.cos(2 * Math.PI * el / DRIFT_P1))
    + DRIFT_A2 * DRIFT_P2 / (2 * Math.PI) * (Math.cos(DRIFT_PH2) - Math.cos(2 * Math.PI * el / DRIFT_P2 + DRIFT_PH2));
  return (tw / LOOP_S) % 1;
}
function record(sid) {
  if (!AC) return;
  if (loopStart === null) { loopStart = AC.currentTime; lastStep = 0; }
  const ph = loopPhase();
  events.push({ sid, step: Math.round(ph * STEPS) % STEPS });
  updateStatus();
}
function playbackTick() {
  if (loopStart === null || !AC || muted) { return; }
  const cur = Math.floor(loopPhase() * STEPS);
  if (cur !== lastStep) {
    for (const e of events) if (e.step === cur) triggerVisual(e.sid, 0.7);
    lastStep = cur;
  }
}

// v52: one press for every seal on the card - vermilion ink, rim bite, bleed, and the
// flecks where the press was light. Seed fixes the pattern so a card's stamp is its own.
function pressSeal(g, x, y, rot, ch2, seed, box, MINCHO) {
  const S = 120, R0 = 52;
  const sc = document.createElement('canvas'); sc.width = S; sc.height = S;
  const s2 = sc.getContext('2d');
  let sd = seed;
  const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  s2.fillStyle = '#c3272b';
  s2.beginPath();
  if (s2.roundRect) s2.roundRect(60 - R0, 60 - R0, R0 * 2, R0 * 2, 8); else s2.rect(60 - R0, 60 - R0, R0 * 2, R0 * 2);
  s2.fill();
  // ink gathers heavier at the rim where the stone bit down
  s2.globalCompositeOperation = 'source-atop';
  const bleed = s2.createRadialGradient(60, 60, 8, 60, 60, 64);
  bleed.addColorStop(0, 'rgba(122,16,20,0.30)');
  bleed.addColorStop(0.72, 'rgba(140,20,24,0.10)');
  bleed.addColorStop(1, 'rgba(88,10,14,0.55)');
  s2.fillStyle = bleed; s2.fillRect(0, 0, S, S);
  // the rim leaks a little past the edge
  s2.globalCompositeOperation = 'source-over';
  s2.fillStyle = '#c3272b';
  for (let i = 0; i < 16; i++) {
    const ang = rnd() * Math.PI * 2;
    const rr = R0 - 2 + rnd() * 4;
    s2.globalAlpha = 0.25 + rnd() * 0.4;
    s2.beginPath(); s2.arc(60 + Math.cos(ang) * rr, 60 + Math.sin(ang) * rr, 1 + rnd() * 2.2, 0, 6.29); s2.fill();
  }
  s2.globalAlpha = 1;
  // white-character seal: the mark cut in cream
  s2.fillStyle = '#f7f2e7';
  s2.font = "56px " + MINCHO;
  s2.textAlign = 'center'; s2.textBaseline = 'middle';
  s2.fillText(ch2, 60, 63);
  // where the press was light the paper shows through
  s2.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 46; i++) {
    s2.globalAlpha = 0.10 + rnd() * 0.30;
    s2.beginPath(); s2.arc(60 + (rnd() * 2 - 1) * R0, 60 + (rnd() * 2 - 1) * R0, 0.6 + rnd() * 2.0, 0, 6.29); s2.fill();
  }
  for (let i = 0; i < 7; i++) {
    const ang = rnd() * Math.PI * 2;
    s2.globalAlpha = 0.35 + rnd() * 0.3;
    s2.beginPath(); s2.arc(60 + Math.cos(ang) * (R0 - 1), 60 + Math.sin(ang) * (R0 - 1), 1.5 + rnd() * 2.5, 0, 6.29); s2.fill();
  }
  s2.globalAlpha = 1; s2.globalCompositeOperation = 'source-over';
  if (typeof LB_SEASON !== 'undefined' && LB_SEASON === 'snow') {
    // v59: snow flecks caught on the stamp - gathered on the top rim, a few blown across the face
    s2.fillStyle = 'rgba(250,250,248,0.9)';
    for (let i = 0; i < 9; i++) {
      const fx = 60 + (rnd() * 2 - 1) * (R0 - 3);
      const fy = 60 - R0 + rnd() * 10 - 3;
      s2.globalAlpha = 0.4 + rnd() * 0.5;
      s2.beginPath(); s2.arc(fx, fy, 0.7 + rnd() * 1.6, 0, 6.29); s2.fill();
    }
    for (let i = 0; i < 3; i++) {
      s2.globalAlpha = 0.25 + rnd() * 0.3;
      s2.beginPath(); s2.arc(60 + (rnd() * 2 - 1) * R0, 60 + (rnd() * 2 - 1) * R0, 0.5 + rnd() * 1.0, 0, 6.29); s2.fill();
    }
    s2.globalAlpha = 1;
  }
  g.save();
  g.translate(x, y); g.rotate(rot);
  g.drawImage(sc, -box / 2, -box / 2, box, box);
  g.restore();
}

function shareTune() {
  const url = location.origin + location.pathname + '#t=' + encodeTune();
  // v54/v55: hear the seals land - harmony first (higher on the card), then the snow hanko,
  // staggered like a printer working down the page. The 福 brand mark is printed, not pressed.
  const pressQueue = [];
  if (harmonyCount > 0) pressQueue.push(0);
  if (LB_SEASON === 'snow') pressQueue.push(pressQueue.length ? 0.18 : 0);
  if (pressQueue.length) {
    audio();
    if (AC) { const pt = AC.currentTime + 0.03; pressQueue.forEach((d, i) => playPress(pt + d, 1 - i * 0.12)); }
  }
  const caption = (tuneName ? tuneName + ' - ' : '') + 'my lucky tune: ' + url;
  let cv = null;
  try { cv = renderShareCard(); } catch (e) {}
  const finish = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(caption);
    shareBtn.textContent = 'copied!';
    setTimeout(() => shareBtn.textContent = 'share your tune', 1300);
  };
  if (!cv) { finish(); return; }
  cv.toBlob(blob => {
    if (!blob) { finish(); return; }
    const file = new File([blob], 'lucky-tune.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], text: caption }).catch(() => {});
      shareBtn.textContent = 'shared!';
      setTimeout(() => shareBtn.textContent = 'share your tune', 1300);
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'lucky-tune.png';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      finish();
    }
  }, 'image/png');
}

// ---------------- layout ----------------
function layout() {
  cat.s = Math.min(H * 0.0014, W * 0.0019);
  cat.x = W * (W < 560 ? 0.5 : 0.56);
  cat.y = H * 0.76;
  coins.length = 0;
  const narrow = W < 560;
  const spread = narrow ? 1.82 : 2.05, cr = narrow ? 0.36 : 0.4;
  for (let i = 0; i < 5; i++) {
    const a = Math.PI * (0.92 + i * 0.29);
    coins.push({
      ux: Math.cos(a) * spread, uy: 0.55 + Math.sin(a) * 0.55,
      r: cr, bounce: 0, sid: i
    });
  }
}
layout(); addEventListener('resize', layout);
const U = v => v * cat.s * 100;
const coinX = c => cat.x + U(c.ux), coinY = c => cat.y + U(c.uy);

function spriteRect() {
  // drawn square side and top edge (sprite bottom sits at the feet line)
  const u = cat.s * 100, S = 3.6 * u;
  return { S, top: cat.y - S + 0.18 * u };
}
function inCat(px, py) {
  const { S, top } = spriteRect();
  return Math.abs(px - cat.x) < S * 0.42 && py > top + S * 0.1 && py < cat.y + U(0.1);
}
function bellPos() {
  const { S, top } = spriteRect();
  return { x: cat.x, y: top + S * 0.575 };
}

// ---------------- input ----------------
let firstGesture = false;
function down(e) {
  audio();
  if (AC && AC.state === 'suspended') AC.resume();
  if (!firstGesture) { firstGesture = true; if (events.length && loopStart === null) { loopStart = AC.currentTime; lastStep = 0; updateStatus(); } }
  const t = e.touches && e.touches.length ? e.touches[0] : e;
  const px = t.clientX, py = t.clientY;
  for (const c of coins) {
    if (Math.hypot(px - coinX(c), py - coinY(c)) < U(c.r)) { tap(c.sid, px, py); return; }
  }
  const b = bellPos();
  if (Math.hypot(px - b.x, py - b.y) < U(0.3)) { tap(5, px, py); return; }
  if (inCat(px, py)) { tap(6, px, py); return; }
}
let lastTouchT = -9;
canvas.addEventListener('mousedown', e => { if (T - lastTouchT < 0.6) return; down(e); });
canvas.addEventListener('touchstart', e => { lastTouchT = T; down(e); }, { passive: true });

function tap(sid, px, py) {

  }

  if (new Set(recentTaps.map(r => r.sid)).size >= 3 && T - lastHarmony > 4) {

    { const nw = Date.now() / 1000;

    furinGlow = 1.6;

        o.type = 'sine'; o.frequency.value = f;

    }

  }

}
function triggerVisual(sid, vol) {

}

// ---------------- status ----------------
function updateStatus() {
  const st = document.getElementById('status');
  const bTxt = best ? ' <span style="color:var(--gold)">· best ' + best + '</span>' : '';
  if (echo) {
    if (echo.phase === 'show') st.innerHTML = 'listen… 聞いて';
    else if (echo.phase === 'input') st.innerHTML = 'your turn · ' + echo.idx + ' / ' + echo.seq.length;
    else st.innerHTML = 'level ' + echo.level + bTxt + ' · tap echo to play once more';
  } else {
    if (loopStart === null) st.innerHTML = (events.length ? 'a shared tune is loaded - tap to hear it' : 'tap something lucky') + bTxt;
    else st.innerHTML = '\u25CF looping ' + events.length + ' note' + (events.length === 1 ? '' : 's') + ' \u00B7 keep tapping to overdub' + bTxt;
  }
  shareBtn.style.display = events.length && !echo ? 'block' : 'none';
  clearBtn.style.display = (events.length || loopStart !== null) && !echo ? 'block' : 'none';
  nameEl.style.display = events.length && !echo ? 'block' : 'none';
}

// ---------------- leaves (momiji, unlock at echo best 5) ----------------
function spawnLeaf(burst) {
  leaves.push({
    x: burst ? cat.x + (Math.random() - 0.5) * U(4) : Math.random() * W,
    y: burst ? cat.y - U(2.5) : -20 - Math.random() * H * 0.3,
    vy: 26 + Math.random() * 22, sway: Math.random() * 6.28, rs: (Math.random() - 0.5) * 2.4,
    rot: Math.random() * 6.28, s: 7 + Math.random() * 6,
    col: LEAF_COLS[LB_SEASON][Math.random() < 0.5 ? 0 : 1], a: burst ? 1 : 0.55 + Math.random() * 0.3
  });
}

// ---------------- drawing ----------------
function ensoPath(cx, cy, R, wBase, a0, sweep) {
  // tapered brush ring: outer arc out, inner arc back, closed
  const N = 64, p = new Path2D();
  for (let i = 0; i <= N; i++) {
    const a = a0 + (i / N) * sweep;
    const w = wBase * (0.22 + 0.78 * Math.pow(Math.sin((i / N) * Math.PI), 1.35));
    const x = cx + Math.cos(a) * (R + w), y = cy + Math.sin(a) * (R + w);
    if (i === 0) p.moveTo(x, y); else p.lineTo(x, y);
  }
  for (let i = N; i >= 0; i--) {
    const a = a0 + (i / N) * sweep;
    const w = wBase * (0.22 + 0.78 * Math.pow(Math.sin((i / N) * Math.PI), 1.35));
    p.lineTo(cx + Math.cos(a) * (R - w), cy + Math.sin(a) * (R - w));
  }
  p.closePath();
  return p;
}
function drawEnso(t) {
  const cx = cat.x, cy = cat.y - U(1.45), R = U(2.55);
  ctx.fillStyle = (ENSO_TINT[LB_SEASON] || [P('enso')])[night ? 1 : 0];
  ctx.fill(ensoPath(cx, cy, R, U(0.09), -2.2, 5.9));
  // harmonies found, ever: small vermilion beads along the inner lower arc
  if (harmonyCount > 0) {
    const streakLive = streak > 1 && (Date.now() / 1000 - streakT) < 20;
    ctx.fillStyle = '#c3272b';
    for (let i = 0; i < Math.min(harmonyCount, 10); i++) {
      const a = Math.PI - 0.55 + i * 0.11;
      const shimmer = streakLive ? 1 + 0.35 * Math.sin((t || 0) * 4 - i * 0.6) : 1;
      const bx = cx + Math.cos(a) * (R - U(0.34)), by = cy + Math.sin(a) * (R - U(0.34));
      if (streakLive) {
        ctx.save(); ctx.globalAlpha = 0.3 + 0.2 * Math.sin((t || 0) * 4 - i * 0.6);
        ctx.fillStyle = '#b98a1c';
        ctx.beginPath(); ctx.arc(bx, by, Math.max(2, U(0.05)) * 2.1 * shimmer, 0, 6.29); ctx.fill();
        ctx.restore(); ctx.fillStyle = '#c3272b';
      }
      ctx.beginPath();
      ctx.arc(bx, by, Math.max(2, U(0.05)) * shimmer, 0, 6.29);
      ctx.fill();
    }
  }
  // echo run: one gold mark per level climbed, set along the ring
  if (echo && echo.level > 1) {
    ctx.save();
    ctx.strokeStyle = night ? 'rgba(201,162,39,0.9)' : 'rgba(154,117,22,0.85)';
    ctx.lineWidth = Math.max(1.5, U(0.03)); ctx.lineCap = 'round';
    for (let i = 0; i < Math.min(echo.level - 1, 24); i++) {
      const a = -2.2 + (i + 1) * (5.9 / 24);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * (R - U(0.16)), cy + Math.sin(a) * (R - U(0.16)));
      ctx.lineTo(cx + Math.cos(a) * (R + U(0.16)), cy + Math.sin(a) * (R + U(0.16)));
      ctx.stroke();
    }
    ctx.restore();
  }
}

function drawLanterns(t) {
  for (const l of lanterns) {
    const rain = LB_SEASON === 'rain';
    const x = l.fx * W + Math.sin(t * (rain ? 0.95 : 0.45) + l.ph) * (rain ? 11 : 6);
    const y = l.fy * H;
    if (night) {
      // rain gutters the flame: two incommensurate waves plus the occasional deep dip
      let fl = 1;
      if (rain) {
        const w1 = Math.sin(t * 7.3 + l.ph * 3.1) * Math.sin(t * 2.9 + l.ph);
        const dip = Math.pow(Math.max(0, Math.sin(t * 1.7 + l.ph * 2.3)), 6);
        fl = Math.max(0.12, (0.62 + 0.38 * w1) * (1 - 0.6 * dip));
      }
      const lg = ctx.createRadialGradient(x, y, 2, x, y, l.r * 4.2);
      const gc = LANTERN_GLOW[LB_SEASON] || '255,214,150';
      lg.addColorStop(0, 'rgba(' + gc + ',' + (0.30 * fl).toFixed(3) + ')'); lg.addColorStop(1, 'rgba(' + gc + ',0)');
      ctx.fillStyle = lg; ctx.fillRect(x - l.r * 4.2, y - l.r * 4.2, l.r * 8.4, l.r * 8.4);
      l.fl = fl;
    }
    ctx.strokeStyle = P('line'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(l.fx * W, 0); ctx.lineTo(x, y - l.r); ctx.stroke();
    ctx.fillStyle = '#c3272b';
    ctx.beginPath(); ctx.ellipse(x, y, l.r * 0.72, l.r, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(247,242,231,' + (night ? (0.55 + 0.35 * (l.fl == null ? 1 : l.fl)).toFixed(3) : '0.9') + ')';
    ctx.beginPath(); ctx.ellipse(x, y, l.r * 0.34, l.r * 0.88, 0, 0, 6.29); ctx.fill();
    ctx.strokeStyle = P('line2');
    for (const fy of [-0.45, 0, 0.45]) {
      ctx.beginPath(); ctx.ellipse(x, y + fy * l.r * 0.6, l.r * (0.72 - Math.abs(fy) * 0.28), l.r * 0.16, 0, 0, 6.29); ctx.stroke();
    }
    ctx.fillStyle = P('ink');
    ctx.fillRect(x - l.r * 0.26, y - l.r - 2.5, l.r * 0.52, 3.5);
    ctx.fillRect(x - l.r * 0.26, y + l.r - 1, l.r * 0.52, 3.5);
  }
}

function drawCat(t, dt) {
  const u = cat.s * 100;
  const beatBob = loopStart !== null ? Math.sin(loopPhase() * Math.PI * 2 * 4) * 0.5 + 0.5 : 0;
  headBob = Math.max(0, headBob - dt * 2.5);
  bellSwing = Math.max(0, bellSwing - dt * 2.2);
  const breathe = Math.sin(t * 1.1) * 0.008;
  const bob = Math.sin(t * 1.4) * 0.02 + beatBob * 0.03 + headBob * 0.06;
  wavePhase += dt * (2.4 + beatBob * 2 + headBob * 3);

  const { S, top } = spriteRect();
  const yOff = bob * u * -1;
  if (catBaseImg.complete && catBaseImg.naturalWidth) {
    if (night && !catBaseNight) { catBaseNight = creamOf(catBaseImg); catPawNight = creamOf(catPawImg); }
    const baseIm = night && catBaseNight ? catBaseNight : catBaseImg;
    const pawIm = night && catPawNight ? catPawNight : catPawImg;
    ctx.save();
    ctx.translate(cat.x, cat.y + yOff);
    ctx.scale(1 + breathe * 0.5, 1 + breathe);
    ctx.rotate(headBob * 0.03);
    ctx.drawImage(baseIm, -S / 2, top - cat.y, S, S);
    // paw layer waves on the documented anchor (34.5% / 47% of the frame)
    const wp = T % 3.6;
    const wa = wp < 1.2 ? Math.sin(wp / 1.2 * Math.PI * 4) * 0.24 : 0; // brand loop: two waves, then rest
    ctx.translate(-S / 2 + 0.345 * S, top - cat.y + 0.47 * S);
    ctx.rotate(wa);
    ctx.drawImage(pawIm, -0.345 * S, -0.47 * S, S, S);
    ctx.restore();
  }
}

function drawCoins(dt) {
  for (const c of coins) {
    c.bounce = Math.max(0, c.bounce - dt * 3);
    const x = coinX(c), y = coinY(c) - c.bounce * U(0.18);
    const r = U(c.r) * (1 + c.bounce * 0.15);
    // koban: oval gold coin with 福
    const glow = ctx.createRadialGradient(x, y, 2, x, y, r * 2.2);
    glow.addColorStop(0, 'rgba(185,138,28,' + (0.2 + c.bounce * 0.45) + ')');
    glow.addColorStop(1, 'rgba(185,138,28,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4);
    ctx.fillStyle = '#d4af37';
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.82, r, 0, 0, 6.29); ctx.fill();
    ctx.strokeStyle = COIN_RIM[LB_SEASON] || '#8a6d1f'; ctx.lineWidth = Math.max(1.5, U(0.04));
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.82, r, 0, 0, 6.29); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(x, y, r * 0.56, r * 0.72, 0, 0, 6.29); ctx.stroke();
    ctx.fillStyle = '#7a5c12';
    ctx.font = Math.round(r * 0.78) + "px 'Hiragino Mincho ProN', YuMincho, 'Noto Serif CJK JP', serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(c.sid === 2 ? '\u798F' : LB_SEASONS[LB_SEASON], x, y + r * 0.05);
  }
}

function drawLeaf(l, dt) {
  l.y += l.vy * dt; l.sway += dt * 1.6; l.rot += l.rs * dt;
  l.x += Math.sin(l.sway) * 24 * dt;
  ctx.save();
  ctx.translate(l.x + Math.sin(l.sway) * 10, l.y);
  ctx.rotate(l.rot);
  ctx.globalAlpha = l.a;
  ctx.fillStyle = l.col;
  const s = l.s;
  ctx.beginPath();
  if (LB_SEASON === 'sakura') {
    // sakura petal: rounded lobes with the notch at the tip
    ctx.moveTo(0, s * 0.7);
    ctx.quadraticCurveTo(s * 0.75, s * 0.3, s * 0.62, -s * 0.35);
    ctx.quadraticCurveTo(s * 0.5, -s * 0.9, s * 0.12, -s * 0.85);
    ctx.lineTo(0, -s * 0.62);
    ctx.lineTo(-s * 0.12, -s * 0.85);
    ctx.quadraticCurveTo(-s * 0.5, -s * 0.9, -s * 0.62, -s * 0.35);
    ctx.quadraticCurveTo(-s * 0.75, s * 0.3, 0, s * 0.7);
  } else {
    ctx.moveTo(0, -s);
    ctx.quadraticCurveTo(s * 0.9, -s * 0.3, s * 0.5, s * 0.4);
    ctx.quadraticCurveTo(s * 0.2, s * 0.9, 0, s * 0.55);
    ctx.quadraticCurveTo(-s * 0.2, s * 0.9, -s * 0.5, s * 0.4);
    ctx.quadraticCurveTo(-s * 0.9, -s * 0.3, 0, -s);
  }
  ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------------- furin (rings on harmony) ----------------
let furinGlow = 0, furinDrops = [];
function drawFurin(t, dt) {
  const sway = Math.sin(t * 0.7) * 0.06 + furinGlow * Math.sin(t * 6) * 0.08;
  const bx = W * 0.36, by = 64;
  ctx.strokeStyle = P('line'); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W * 0.36, 0); ctx.lineTo(bx + sway * 46, by); ctx.stroke();
  ctx.save();
  ctx.translate(bx + sway * 46, by); ctx.rotate(sway);
  if (furinGlow > 0) {
    const fg = ctx.createRadialGradient(0, 10, 2, 0, 10, 44);
    fg.addColorStop(0, 'rgba(212,175,55,' + (0.4 * Math.min(1, furinGlow)) + ')');
    fg.addColorStop(1, 'rgba(212,175,55,0)');
    ctx.fillStyle = fg; ctx.fillRect(-44, -34, 88, 88);
  }
  // glass dome
  ctx.fillStyle = night ? 'rgba(207,232,239,0.16)' : 'rgba(207,232,239,0.4)';
  ctx.strokeStyle = P('line2'); ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0, 10, 15, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 10, 15, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
  // clapper + tanzaku strip
  ctx.fillStyle = P('ink');
  ctx.beginPath(); ctx.arc(0, 22, 2.4, 0, 6.29); ctx.fill();
  const STRIP = { momiji: '#f7f2e7', sakura: '#f7dfe5', snow: '#eef2f5', firefly: '#eef5d8', rain: '#dfe8ef' };
  ctx.fillStyle = night ? '#e8e2d2' : (STRIP[LB_SEASON] || '#f7f2e7');
  ctx.strokeStyle = P('line'); ctx.lineWidth = 1;
  ctx.fillRect(-4.5, 24, 9, 26); ctx.strokeRect(-4.5, 24, 9, 26);
  ctx.fillStyle = '#c3272b';
  ctx.font = "9px 'Hiragino Mincho ProN', YuMincho, serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('\u798F', 0, 38);
  // rain-night: droplets streak the glass dome
  if (night && LB_SEASON === 'rain') {
    if (furinDrops.length < 5 && Math.random() < dt * 1.4) {
      const dx = (Math.random() - 0.5) * 20;
      furinDrops.push({ x: dx, y: 10 - Math.sqrt(Math.max(0, 225 - dx * dx)) + 1, v: 5 + Math.random() * 5, a: 0.55 });
    }
    ctx.strokeStyle = 'rgba(207,232,239,1)'; ctx.lineWidth = 1;
    for (let i = furinDrops.length - 1; i >= 0; i--) {
      const dr = furinDrops[i];
      dr.y += dr.v * dt; dr.a -= dt * 0.28;
      if (dr.y >= 9.5 || dr.a <= 0) { furinDrops.splice(i, 1); continue; }
      ctx.globalAlpha = dr.a;
      ctx.beginPath(); ctx.moveTo(dr.x, dr.y - 3.2); ctx.lineTo(dr.x, dr.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  } else if (furinDrops.length) furinDrops.length = 0;
  ctx.restore();
}

// ---------------- main loop ----------------
let T = 0, last = 0, leafT = 0;
function tick(ts) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016);
  furinGlow = Math.max(0, furinGlow - dt);
  last = ts; T = ts / 1000;
  playbackTick();
  thunderTick(dt);
  const tapeTarget = (night && LB_SEASON === 'rain') ? 1 : 0;
  const frostTarget = (night && LB_SEASON === 'snow') ? 1 : 0;
  if (tapeEase !== tapeTarget || frostEase !== frostTarget) {
    tapeEase += Math.sign(tapeTarget - tapeEase) * Math.min(Math.abs(tapeTarget - tapeEase), tapeTarget > tapeEase ? dt / 2.2 : dt / 90);
    frostEase += Math.sign(frostTarget - frostEase) * Math.min(Math.abs(frostTarget - frostEase), frostTarget > frostEase ? dt / 2.2 : dt / 90);
    applyDrift();
  }
  // v47: after a quiet breath, pale rings on the ground replay the rhythm you rang
  if (!echoAnswered && tapRhythm.length >= 3 && T - tapRhythm[tapRhythm.length - 1] > 4) {
    echoAnswered = true; echoReplayed++;
    let acc = 0;
    const gy = cat.y + U(0.9), gx = cat.x;
    for (let i = 1; i < tapRhythm.length; i++) {
      acc += Math.min(1.2, Math.max(0.12, tapRhythm[i] - tapRhythm[i - 1]));
      if (acc > 8) break;
      setTimeout(() => {
        ripples.push({ x: gx, y: gy, r: U(0.4), a: 0.7, w: 1 });
        ripples.push({ x: gx, y: gy, r: U(0.15), a: 0.5, w: 1 });
      }, acc * 1000);
    }
  }
  // attract mode: untouched and silent for a while - the cat hums a phrase
  if (AC && !muted && !echo && events.length === 0 && T - lastInteract > 22 && T > humUntil) {
    humUntil = T + 55; lastInteract = T;
    [[0, 0], [0.5, 2], [1.0, 4], [1.9, 3], [2.4, 1], [3.3, 0]].forEach(([dt2, sid]) => {
      setTimeout(() => {
        if (events.length || echo) return;
        playSid(sid, undefined, 0.35);
        notes.push({ x: cat.x + (Math.random() - 0.5) * 60, y: cat.y - U(2.2), vy: -22, a: 1, ch: '\u266A', s: 0.8 });
      }, dt2 * 1000);
    });
  }
  if (loopStart !== null) document.getElementById('loopFill').style.width = (loopPhase() * 100).toFixed(1) + '%';

  // washi paper
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, P('bg0')); bg.addColorStop(0.55, P('bg1')); bg.addColorStop(1, P('bg2'));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (!grainPat) grainPat = ctx.createPattern(grain, 'repeat');
  ctx.fillStyle = grainPat; ctx.fillRect(0, 0, W, H);
  if (skyFlash > 0) { ctx.fillStyle = 'rgba(240,233,216,' + (0.055 * skyFlash).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H * 0.65); }

  drawEnso(T);
  drawLanterns(T);
  drawFurin(T, dt);

  // cushion
  ctx.fillStyle = '#a41f23';
  ctx.beginPath(); ctx.ellipse(cat.x, cat.y + U(0.12), U(1.55), U(0.34), 0, 0, 6.29); ctx.fill();
  ctx.fillStyle = '#c3272b';
  ctx.beginPath(); ctx.ellipse(cat.x, cat.y + U(0.05), U(1.5), U(0.3), 0, 0, 6.29); ctx.fill();
  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = Math.max(1.5, U(0.035));
  ctx.beginPath(); ctx.ellipse(cat.x, cat.y + U(0.05), U(1.5), U(0.3), 0, 0.15, 2.99); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(cat.x, cat.y + U(0.05), U(1.5), U(0.3), 0, 3.29, 6.13); ctx.stroke();

  drawCat(T, dt);
  drawCoins(dt);

  // momiji
  if (leavesOn) {
    leafT -= dt;
    if (leafT <= 0 && leaves.length < 7) { leafT = 2.2 + Math.random() * 2.5; spawnLeaf(false); }
    for (let i = leaves.length - 1; i >= 0; i--) {
      const l = leaves[i];
      drawLeaf(l, dt);
      if (l.y > H + 30) leaves.splice(i, 1);
    }
  }

  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i];
    r.r += dt * (r.w ? 130 : 220); r.a -= dt * (r.w ? 0.85 : 2.4);
    if (r.a <= 0) { ripples.splice(i, 1); continue; }
    ctx.globalAlpha = r.a;
    ctx.strokeStyle = r.w ? (ANSWER_COL[LB_SEASON] || '#aec6d8') : '#b98a1c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.29); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  for (let i = notes.length - 1; i >= 0; i--) {
    const n = notes[i];
    n.y += n.vy * dt; n.a -= dt * 1.1;
    if (n.a <= 0) { notes.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, n.a);
    ctx.font = Math.round(22 * n.s) + "px 'Hiragino Mincho ProN', YuMincho, 'Noto Serif CJK JP', serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = n.gold ? '#b98a1c' : '#8a6d1f';
    ctx.fillText(n.ch, n.x, n.y);
    ctx.globalAlpha = 1;
  }
}
requestAnimationFrame(tick);

window.__lb = () => ({ events: events.length, loopOn: loopStart !== null, phase: +loopPhase().toFixed(3), code: events.length ? encodeTune() : null, best, dayN, leavesOn, furin: +furinGlow.toFixed(2) });
window.__lbPress = () => pressCount;
window.__lbChime = () => ({ last: lastChimeNotes, total: chimeTotal });
window.__lbTape = () => ({ on: night && LB_SEASON === 'rain', ease: +tapeEase.toFixed(3), frost: night && LB_SEASON === 'snow', fease: +frostEase.toFixed(3), wowA: +DRIFT_A1.toFixed(3), wowP: Math.round(DRIFT_P1), warmHz: warmLp ? Math.round(warmLp.frequency.value) : 0, frostDb: frostHs ? +frostHs.gain.value.toFixed(1) : 0, frostHp: frostHp ? Math.round(frostHp.frequency.value) : 0, wobCents: wobGain ? +wobGain.gain.value.toFixed(1) : 0 });

window.__lbGeom = () => ({ cat: { x: cat.x, y: cat.y, u: cat.s * 100 }, coins: coins.map(c => ({ x: coinX(c), y: coinY(c), r: U(c.r) })), bell: bellPos() });
window.__lbEcho = () => echo ? { phase: echo.phase, idx: echo.idx, level: echo.level, seq: echo.seq.slice() } : null;

// distant thunder: a rare roll when the rain layer is live, lightning a breath before the sound
let skyFlash = 0, thunderNext = 25 + Math.random() * 40, thunderRolls = 0;
function thunderTick(dt) {
  skyFlash = Math.max(0, skyFlash - dt * 0.45);
  if (!rainNodes) return;
  thunderNext -= dt;
  if (thunderNext <= 0) { thunderNext = 70 + Math.random() * 80; playThunder(); }
}
function playThunder() {
  if (!AC || muted) return;
  thunderRolls++; skyFlash = 1;
  const t0 = AC.currentTime, dur = 3.2;
  const buf = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = last * 0.98 + w * 0.02; d[i] = last * 4; }
  const delay = 1.2 + Math.random() * 1.6;
  [0, 0.9].forEach((off, i) => {
    const s = AC.createBufferSource(); s.buffer = buf;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(320, t0 + delay + off);
    lp.frequency.exponentialRampToValueAtTime(70, t0 + delay + off + 2.4);
    const g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t0 + delay + off);
    g.gain.exponentialRampToValueAtTime(i ? 0.05 : 0.085, t0 + delay + off + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + delay + off + 2.8);
    s.connect(lp); lp.connect(g); g.connect(master);
    s.start(t0 + delay + off); s.stop(t0 + delay + off + 3);
  });
}
window.__lbRain = () => ({ want: night && LB_SEASON === 'rain', on: !!rainNodes, gain: rainNodes ? +rainNodes.g.gain.value.toFixed(4) : 0 });
window.__lbThunder = () => { playThunder(); return { rolls: thunderRolls, flash: skyFlash }; };
</script>
